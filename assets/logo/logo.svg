<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffe9a3"/>
      <stop offset="55%" stop-color="#f2a86b"/>
      <stop offset="100%" stop-color="#7a3f3a"/>
    </radialGradient>
    <linearGradient id="realMtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c8a3f"/>
      <stop offset="100%" stop-color="#2c4a1f"/>
    </linearGradient>
    <linearGradient id="realMtnBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ba05b"/>
      <stop offset="100%" stop-color="#3f6b2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3cf"/>
      <stop offset="100%" stop-color="#c99a2e"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="256" y="0" width="256" height="512"/>
    </clipPath>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="256" height="512"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- sky -->
    <circle cx="256" cy="256" r="256" fill="url(#sky)"/>

    <!-- sun / duality disc -->
    <circle cx="256" cy="150" r="46" fill="url(#gold)"/>
    <path d="M256,104 A46,46 0 0 1 256,196 Z" fill="none" stroke="#3a2c14" stroke-width="2" opacity="0.35"/>
    <circle cx="256" cy="150" r="46" fill="none" stroke="#c99a2e" stroke-width="3"/>

    <!-- far mountains -->
    <path d="M-20,300 L90,210 L150,260 L230,190 L256,220 L256,420 L-20,420 Z" fill="url(#realMtnBack)" opacity="0.85" clip-path="url(#leftHalf)"/>
    <path d="M256,220 L282,190 L362,260 L422,210 L532,300 L532,420 L256,420 Z" fill="none" clip-path="url(#rightHalf)"/>

    <!-- REAL side (left) : solid mountain -->
    <path d="M-20,420 L-20,340 L70,230 L130,300 L190,240 L256,330 L256,420 Z" fill="url(#realMtn)" clip-path="url(#leftHalf)"/>

    <!-- VIRTUAL side (right) : wireframe / pixel mountain mirrored -->
    <g clip-path="url(#rightHalf)" fill="none" stroke="#F2C14E" stroke-width="2.5" opacity="0.95">
      <path d="M532,420 L532,340 L442,230 L382,300 L322,240 L256,330 L256,420 Z"/>
      <path d="M256,330 L322,240 L382,300 L442,230 L532,340" stroke-dasharray="1 10" stroke-linecap="round" stroke-width="4"/>
    </g>
    <!-- pixel accents on virtual side -->
    <g fill="#F2C14E" opacity="0.9">
      <rect x="300" y="270" width="8" height="8"/>
      <rect x="336" y="246" width="8" height="8"/>
      <rect x="372" y="278" width="8" height="8"/>
      <rect x="408" y="250" width="8" height="8"/>
      <rect x="452" y="286" width="8" height="8"/>
      <rect x="480" y="310" width="6" height="6"/>
      <rect x="324" y="300" width="6" height="6"/>
    </g>

    <!-- ground -->
    <rect x="-20" y="420" width="552" height="100" fill="#231b10"/>

    <!-- central frontier gate (torii-like arch straddling the seam) -->
    <g stroke="url(#gold)" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="212" y1="330" x2="212" y2="430"/>
      <line x1="300" y1="330" x2="300" y2="430"/>
      <line x1="196" y1="336" x2="316" y2="336"/>
      <line x1="204" y1="360" x2="308" y2="360"/>
    </g>
    <circle cx="256" cy="358" r="5" fill="#fff3cf"/>

    <!-- seam glow -->
    <rect x="253" y="0" width="6" height="512" fill="#F2C14E" opacity="0.55"/>
  </g>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#2c2313" stroke-width="10"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#F2C14E" stroke-width="2" opacity="0.7"/>
</svg>
