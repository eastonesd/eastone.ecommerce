<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shopee.robot 儀表板</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="分潤機器人">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* 東石品牌：藏青 + 金（與 eastone.com 同一套色票） */
:root{
  --bg:#F6F3EC; --panel:#FFFDF8; --ink:#2A2A26; --muted:#6B6656; --line:#D8D0BC;
  --accent:#1B2A4A; --on-accent:#F6F3EC; --accent-soft:#EDE8DC; --gold:#B8892B; --gold-soft:#F3E9D2; --series2:#B8892B;
  --good:#2F7D5B; --warn:#A63D40;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --panel:#121D33; --ink:#F6F3EC; --muted:#A9B3C9; --line:#2E4370;
  --accent:#D4A84A; --on-accent:#121D33; --accent-soft:#1B2A4A; --gold:#D4A84A; --gold-soft:#2A2A1E; --series2:#7F95C2;
  --good:#5BC79A; --warn:#E0787A;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:22px}
h1{margin:0;font-size:22px;letter-spacing:.5px}
h1{display:flex;align-items:center;gap:10px}
h1 .logo{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px var(--gold),0 2px 10px rgba(18,29,51,.35)}
h1 b{color:var(--gold)}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px;display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font:500 26px/1.2 "JetBrains Mono",monospace;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:14px;margin:0 0 12px;font-weight:700}
.chart{position:relative;height:260px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-family:"JetBrains Mono",monospace}
td.name{white-space:normal;min-width:180px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px}
.good{color:var(--good)} .warn{color:var(--warn)}
a{color:inherit}
.wrap{padding-top:max(28px,env(safe-area-inset-top))}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);background:var(--panel)}
.badge b{color:var(--ink);font-weight:500}
#install{display:none;border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 14px;font:inherit;font-size:13px;cursor:pointer}
.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.draft{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.draft.done{opacity:.45}
.draft h3{margin:0;font-size:13px;font-weight:700}
.draft pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;background:var(--bg);border-radius:8px;padding:10px}
.draft .lbl{font-size:12px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="icons/icon-192.png" alt="" width="40" height="40"><span><b>shopee</b>.robot</span></h1>
    <span class="sub" id="updated">載入中…</span>
    <div class="badges" id="badges"></div>
    <button id="install">安裝 App</button>
  </header>
  <div class="banner" id="banner">目前顯示的是示範資料。在 queue.yaml 加入商品（或設定好 API 金鑰）後，這裡會自動換成你的資料。</div>

  <section class="card" id="drafts-card" style="margin-bottom:12px;display:none">
    <h2>待發布草稿 <span class="sub" id="drafts-count"></span></h2>
    <p class="hint">複製主文發到 Threads，再複製留言貼在自己那篇底下。完成後按「已發布」，這台裝置會記住。</p>
    <div class="drafts" id="drafts"></div>
  </section>

  <section class="kpis">
    <div class="kpi"><div class="l">累計佣金</div><div class="v" id="k-comm">–</div><div class="d" id="k-comm-d"></div></div>
    <div class="kpi"><div class="l">成交筆數</div><div class="v" id="k-orders">–</div><div class="d" id="k-orders-d"></div></div>
    <div class="kpi"><div class="l">發文數</div><div class="v" id="k-posts">–</div><div class="d" id="k-posts-d"></div></div>
    <div class="kpi"><div class="l">總曝光</div><div class="v" id="k-views">–</div><div class="d" id="k-views-d"></div></div>
    <div class="kpi"><div class="l">每千次曝光收益</div><div class="v" id="k-rpm">–</div><div class="d">RPM，判斷選品好壞的核心指標</div></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>每日趨勢</h2>
      <div class="tabs" id="trend-tabs">
        <button class="on" data-k="commission">佣金</button>
        <button data-k="views">曝光</button>
        <button data-k="engage">互動</button>
      </div>
      <div class="chart"><canvas id="trend"></canvas></div>
    </div>
    <div class="card">
      <h2>各品類佣金</h2>
      <div class="chart"><canvas id="cats"></canvas></div>
    </div>
  </section>

  <section class="card" style="margin-bottom:12px">
    <h2>貼文成效（預估 vs 實際）</h2>
    <div class="tbl"><table id="posts"><thead><tr>
      <th>日期</th><th>商品</th><th>品類</th><th class="num">曝光</th><th class="num">讚</th><th class="num">留言</th>
      <th class="num">成交</th><th class="num">預估</th><th class="num">實際</th>
    </tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card">
    <h2>候選商品池 <span class="sub" id="pool"></span></h2>
    <div class="tbl"><table id="cands"><thead><tr>
      <th>商品</th><th>品類</th><th class="num">價格</th><th class="num">佣金率</th><th class="num">已售</th>
      <th class="num">評分</th><th class="num">預估/篇</th><th class="num">分數</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const nt = v => "NT$" + Math.round(v).toLocaleString();
const n = v => Math.round(v).toLocaleString();
const day = iso => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function getJSON(path){ try{ const r = await fetch(path,{cache:"no-store"}); return r.ok ? r.json() : null; }catch{ return null; } }

async function load(){
  let base = "data/";
  let meta = await getJSON(base + "meta.json");
  if(!meta || !(meta.total_posts || meta.total_drafts)){ base = "data/demo/"; meta = await getJSON(base + "meta.json"); $("#banner").style.display = "block"; }
  const [posts, convs, cands, drafts] = await Promise.all(["posts","conversions","candidates","drafts"].map(f => getJSON(base + f + ".json")));
  renderDrafts(drafts || []);
  render(meta || {}, posts || [], convs || [], cands || {top:[]});
}

const MODE = { api:"API", queue:"手動佇列", demo:"示範", draft:"草稿" };
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)) || {}; }catch{ return {}; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };

function renderDrafts(drafts){
  if(!drafts.length) return;
  const done = store.get("drafts-done");
  const list = [...drafts].reverse();
  const pending = list.filter(d => !done[d.sub_id]).length;
  $("#drafts-card").style.display = "block";
  $("#drafts-count").textContent = `${pending} 份待發布 / 共 ${list.length}`;
  $("#drafts").innerHTML = list.map(d => `
    <div class="draft ${done[d.sub_id] ? "done" : ""}" data-id="${esc(d.sub_id)}">
      <h3>${esc(d.name)}</h3>
      <div class="row"><span class="pill">${esc(d.keyword||"")}</span><span class="sub">預估 ${nt(d.expected_commission||0)}/篇</span></div>
      <div class="lbl">主文</div><pre data-k="text">${esc(d.text)}</pre>
      <div class="lbl">留言（貼在自己的貼文底下）</div><pre data-k="reply">${esc(d.reply)}</pre>
      <div class="row">
        <button class="btn primary" data-copy="text">複製主文</button>
        <button class="btn" data-copy="reply">複製留言</button>
        <button class="btn" data-done>${done[d.sub_id] ? "改回未發布" : "已發布"}</button>
      </div>
    </div>`).join("");
  $("#drafts").onclick = async e => {
    const card = e.target.closest(".draft"); if(!card) return;
    if(e.target.dataset.copy){
      const txt = card.querySelector(`pre[data-k="${e.target.dataset.copy}"]`).textContent;
      try{ await navigator.clipboard.writeText(txt); }catch{ const r=document.createRange(); r.selectNodeContents(card.querySelector(`pre[data-k="${e.target.dataset.copy}"]`)); getSelection().removeAllRanges(); getSelection().addRange(r); }
      const old = e.target.textContent; e.target.textContent = "已複製 ✓"; setTimeout(() => e.target.textContent = old, 1200);
    }
    if("done" in e.target.dataset){
      const d = store.get("drafts-done"); d[card.dataset.id] = !d[card.dataset.id]; store.set("drafts-done", d); renderDrafts(drafts);
    }
  };
}

function render(meta, posts, convs, cands){
  $("#updated").textContent = meta.updated_at ? "最後更新 " + new Date(meta.updated_at).toLocaleString("zh-TW") : "尚無資料";
  if(meta.modes) $("#badges").innerHTML =
    `<span class="badge">選品 <b>${MODE[meta.modes.shopee]||meta.modes.shopee}</b></span><span class="badge">發布 <b>${MODE[meta.modes.threads]||meta.modes.threads}</b></span>`;
  const views = posts.reduce((a,p) => a + (p.metrics?.views || 0), 0);
  const comm = convs.reduce((a,c) => a + c.commission, 0);
  const est = posts.reduce((a,p) => a + (p.expected_commission || 0), 0);
  const week = Date.now() - 7*864e5;
  const comm7 = convs.filter(c => c.purchase_time*1000 >= week).reduce((a,c) => a + c.commission, 0);

  $("#k-comm").textContent = nt(comm);
  $("#k-comm-d").textContent = `近 7 天 ${nt(comm7)}　預估 ${nt(est)}`;
  $("#k-orders").textContent = n(convs.length);
  $("#k-orders-d").textContent = posts.length ? `平均 ${(convs.length/posts.length).toFixed(2)} 筆/篇` : "";
  $("#k-posts").textContent = n(posts.length);
  $("#k-posts-d").textContent = `${new Set(posts.map(p=>p.keyword)).size} 個品類`;
  $("#k-views").textContent = n(views);
  $("#k-views-d").textContent = posts.length ? `平均 ${n(views/posts.length)}/篇` : "";
  $("#k-rpm").textContent = views ? nt(comm / views * 1000) : "–";

  // 每日彙整
  const days = {};
  const bucket = d => days[d] ??= {commission:0, views:0, likes:0, replies:0};
  posts.forEach(p => { const b = bucket(day(p.posted_at)); b.views += p.metrics?.views||0; b.likes += p.metrics?.likes||0; b.replies += p.metrics?.replies||0; });
  convs.forEach(c => bucket(day(c.purchase_time*1000)).commission += c.commission);
  const sorted = Object.entries(days).sort((a,b) => { const [am,ad]=a[0].split("/").map(Number), [bm,bd]=b[0].split("/").map(Number); return am-bm || ad-bd; });
  const labels = sorted.map(e => e[0]);

  Chart.defaults.font.family = '"Noto Sans TC", system-ui';
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--line");
  const accent = css("--accent"), ink = css("--series2");

  const trend = new Chart($("#trend"), { type:"bar", data:{labels, datasets:[]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
  const setTrend = k => {
    const ds = {
      commission: [{label:"佣金", data:sorted.map(e=>e[1].commission), backgroundColor:accent, borderRadius:4}],
      views: [{label:"曝光", data:sorted.map(e=>e[1].views), backgroundColor:ink, borderRadius:4}],
      engage: [{label:"讚", data:sorted.map(e=>e[1].likes), backgroundColor:accent, borderRadius:4},
               {label:"留言", data:sorted.map(e=>e[1].replies), backgroundColor:ink, borderRadius:4}],
    }[k];
    trend.data.datasets = ds; trend.options.plugins.legend.display = ds.length > 1; trend.update();
  };
  setTrend("commission");
  $("#trend-tabs").onclick = e => { if(!e.target.dataset.k) return;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b === e.target)); setTrend(e.target.dataset.k); };

  const cat = {};
  posts.forEach(p => cat[p.keyword] = (cat[p.keyword]||0) + (p.commission||0));
  const catE = Object.entries(cat).sort((a,b) => b[1]-a[1]);
  new Chart($("#cats"), { type:"bar", data:{ labels:catE.map(e=>e[0]), datasets:[{data:catE.map(e=>e[1]), backgroundColor:accent, borderRadius:4}] },
    options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}} } });

  $("#posts tbody").innerHTML = [...posts].reverse().slice(0,40).map(p => {
    const m = p.metrics || {}, diff = (p.commission||0) - (p.expected_commission||0);
    const name = p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
    return `<tr><td>${day(p.posted_at)}</td><td class="name">${name}</td><td><span class="pill">${esc(p.keyword)}</span></td>
      <td class="num">${n(m.views||0)}</td><td class="num">${n(m.likes||0)}</td><td class="num">${n(m.replies||0)}</td>
      <td class="num">${p.orders||0}</td><td class="num">${nt(p.expected_commission||0)}</td>
      <td class="num ${diff>=0?'good':'warn'}">${nt(p.commission||0)}</td></tr>`;
  }).join("") || `<tr><td colspan="9" class="sub">還沒有貼文</td></tr>`;

  $("#pool").textContent = cands.pool_size ? `掃描 ${n(cands.pool_size)} 件，顯示前 ${cands.top.length}` : "";
  $("#cands tbody").innerHTML = (cands.top||[]).map(p => `<tr>
    <td class="name">${esc(p.name)}</td><td><span class="pill">${esc(p.keyword||"")}</span></td>
    <td class="num">${nt(p.price)}</td><td class="num">${(p.commission_rate*100).toFixed(0)}%</td>
    <td class="num">${n(p.sales)}</td><td class="num">${p.rating}</td>
    <td class="num">${nt(p.expected_commission)}</td><td class="num">${p.score.toFixed(3)}</td></tr>`).join("");
}
load();

// ── PWA：離線外殼 + 安裝按鈕 ──
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvt;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#install").style.display = "inline-block"; });
$("#install").onclick = async () => { if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#install").style.display = "none"; };
</script>
</body>
</html>
