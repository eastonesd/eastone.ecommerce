<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shopee.robot 儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f4f1; --panel:#fff; --ink:#1d1b19; --muted:#7a736c; --line:#e7e2dc;
  --accent:#ee4d2d; --accent-soft:#fde5df; --good:#1f9d6b; --warn:#b7791f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141210; --panel:#1d1a17; --ink:#f1ece6; --muted:#9a918a; --line:#2e2a26;
  --accent:#ff6a45; --accent-soft:#3a1f18; --good:#3ccf91; --warn:#e0a84a;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 20px;margin-bottom:22px}
h1{margin:0;font-size:22px;letter-spacing:.5px}
h1 b{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px;display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font:500 26px/1.2 "JetBrains Mono",monospace;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:14px;margin:0 0 12px;font-weight:700}
.chart{position:relative;height:260px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-family:"JetBrains Mono",monospace}
td.name{white-space:normal;min-width:180px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:12px}
.good{color:var(--good)} .warn{color:var(--warn)}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>shopee</b>.robot</h1>
    <span class="sub" id="updated">載入中…</span>
  </header>
  <div class="banner" id="banner">目前顯示的是示範資料。設定好金鑰並關閉 DRY_RUN 後，這裡會自動換成真實成效。</div>

  <section class="kpis">
    <div class="kpi"><div class="l">累計佣金</div><div class="v" id="k-comm">–</div><div class="d" id="k-comm-d"></div></div>
    <div class="kpi"><div class="l">成交筆數</div><div class="v" id="k-orders">–</div><div class="d" id="k-orders-d"></div></div>
    <div class="kpi"><div class="l">發文數</div><div class="v" id="k-posts">–</div><div class="d" id="k-posts-d"></div></div>
    <div class="kpi"><div class="l">總曝光</div><div class="v" id="k-views">–</div><div class="d" id="k-views-d"></div></div>
    <div class="kpi"><div class="l">每千次曝光收益</div><div class="v" id="k-rpm">–</div><div class="d">RPM，判斷選品好壞的核心指標</div></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>每日趨勢</h2>
      <div class="tabs" id="trend-tabs">
        <button class="on" data-k="commission">佣金</button>
        <button data-k="views">曝光</button>
        <button data-k="engage">互動</button>
      </div>
      <div class="chart"><canvas id="trend"></canvas></div>
    </div>
    <div class="card">
      <h2>各品類佣金</h2>
      <div class="chart"><canvas id="cats"></canvas></div>
    </div>
  </section>

  <section class="card" style="margin-bottom:12px">
    <h2>貼文成效（預估 vs 實際）</h2>
    <div class="tbl"><table id="posts"><thead><tr>
      <th>日期</th><th>商品</th><th>品類</th><th class="num">曝光</th><th class="num">讚</th><th class="num">留言</th>
      <th class="num">成交</th><th class="num">預估</th><th class="num">實際</th>
    </tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card">
    <h2>候選商品池 <span class="sub" id="pool"></span></h2>
    <div class="tbl"><table id="cands"><thead><tr>
      <th>商品</th><th>品類</th><th class="num">價格</th><th class="num">佣金率</th><th class="num">已售</th>
      <th class="num">評分</th><th class="num">預估/篇</th><th class="num">分數</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const nt = v => "NT$" + Math.round(v).toLocaleString();
const n = v => Math.round(v).toLocaleString();
const day = iso => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function getJSON(path){ try{ const r = await fetch(path,{cache:"no-store"}); return r.ok ? r.json() : null; }catch{ return null; } }

async function load(){
  let base = "data/";
  let meta = await getJSON(base + "meta.json");
  if(!meta || !meta.total_posts){ base = "data/demo/"; meta = await getJSON(base + "meta.json"); $("#banner").style.display = "block"; }
  const [posts, convs, cands] = await Promise.all(["posts","conversions","candidates"].map(f => getJSON(base + f + ".json")));
  render(meta || {}, posts || [], convs || [], cands || {top:[]});
}

function render(meta, posts, convs, cands){
  $("#updated").textContent = meta.updated_at ? "最後更新 " + new Date(meta.updated_at).toLocaleString("zh-TW") : "尚無資料";
  const views = posts.reduce((a,p) => a + (p.metrics?.views || 0), 0);
  const comm = convs.reduce((a,c) => a + c.commission, 0);
  const est = posts.reduce((a,p) => a + (p.expected_commission || 0), 0);
  const week = Date.now() - 7*864e5;
  const comm7 = convs.filter(c => c.purchase_time*1000 >= week).reduce((a,c) => a + c.commission, 0);

  $("#k-comm").textContent = nt(comm);
  $("#k-comm-d").textContent = `近 7 天 ${nt(comm7)}　預估 ${nt(est)}`;
  $("#k-orders").textContent = n(convs.length);
  $("#k-orders-d").textContent = posts.length ? `平均 ${(convs.length/posts.length).toFixed(2)} 筆/篇` : "";
  $("#k-posts").textContent = n(posts.length);
  $("#k-posts-d").textContent = `${new Set(posts.map(p=>p.keyword)).size} 個品類`;
  $("#k-views").textContent = n(views);
  $("#k-views-d").textContent = posts.length ? `平均 ${n(views/posts.length)}/篇` : "";
  $("#k-rpm").textContent = views ? nt(comm / views * 1000) : "–";

  // 每日彙整
  const days = {};
  const bucket = d => days[d] ??= {commission:0, views:0, likes:0, replies:0};
  posts.forEach(p => { const b = bucket(day(p.posted_at)); b.views += p.metrics?.views||0; b.likes += p.metrics?.likes||0; b.replies += p.metrics?.replies||0; });
  convs.forEach(c => bucket(day(c.purchase_time*1000)).commission += c.commission);
  const sorted = Object.entries(days).sort((a,b) => { const [am,ad]=a[0].split("/").map(Number), [bm,bd]=b[0].split("/").map(Number); return am-bm || ad-bd; });
  const labels = sorted.map(e => e[0]);

  Chart.defaults.font.family = '"Noto Sans TC", system-ui';
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--line");
  const accent = css("--accent"), ink = css("--ink");

  const trend = new Chart($("#trend"), { type:"bar", data:{labels, datasets:[]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
  const setTrend = k => {
    const ds = {
      commission: [{label:"佣金", data:sorted.map(e=>e[1].commission), backgroundColor:accent, borderRadius:4}],
      views: [{label:"曝光", data:sorted.map(e=>e[1].views), backgroundColor:ink, borderRadius:4}],
      engage: [{label:"讚", data:sorted.map(e=>e[1].likes), backgroundColor:accent, borderRadius:4},
               {label:"留言", data:sorted.map(e=>e[1].replies), backgroundColor:ink, borderRadius:4}],
    }[k];
    trend.data.datasets = ds; trend.options.plugins.legend.display = ds.length > 1; trend.update();
  };
  setTrend("commission");
  $("#trend-tabs").onclick = e => { if(!e.target.dataset.k) return;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b === e.target)); setTrend(e.target.dataset.k); };

  const cat = {};
  posts.forEach(p => cat[p.keyword] = (cat[p.keyword]||0) + (p.commission||0));
  const catE = Object.entries(cat).sort((a,b) => b[1]-a[1]);
  new Chart($("#cats"), { type:"bar", data:{ labels:catE.map(e=>e[0]), datasets:[{data:catE.map(e=>e[1]), backgroundColor:accent, borderRadius:4}] },
    options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}} } });

  $("#posts tbody").innerHTML = [...posts].reverse().slice(0,40).map(p => {
    const m = p.metrics || {}, diff = (p.commission||0) - (p.expected_commission||0);
    const name = p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
    return `<tr><td>${day(p.posted_at)}</td><td class="name">${name}</td><td><span class="pill">${esc(p.keyword)}</span></td>
      <td class="num">${n(m.views||0)}</td><td class="num">${n(m.likes||0)}</td><td class="num">${n(m.replies||0)}</td>
      <td class="num">${p.orders||0}</td><td class="num">${nt(p.expected_commission||0)}</td>
      <td class="num ${diff>=0?'good':'warn'}">${nt(p.commission||0)}</td></tr>`;
  }).join("") || `<tr><td colspan="9" class="sub">還沒有貼文</td></tr>`;

  $("#pool").textContent = cands.pool_size ? `掃描 ${n(cands.pool_size)} 件，顯示前 ${cands.top.length}` : "";
  $("#cands tbody").innerHTML = (cands.top||[]).map(p => `<tr>
    <td class="name">${esc(p.name)}</td><td><span class="pill">${esc(p.keyword||"")}</span></td>
    <td class="num">${nt(p.price)}</td><td class="num">${(p.commission_rate*100).toFixed(0)}%</td>
    <td class="num">${n(p.sales)}</td><td class="num">${p.rating}</td>
    <td class="num">${nt(p.expected_commission)}</td><td class="num">${p.score.toFixed(3)}</td></tr>`).join("");
}
load();
</script>
</body>
</html>
