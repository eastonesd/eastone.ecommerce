name: 帶貨片發布

# 亞瑟整理、葉里克先生核准的發布包（promo/<slug>.json）→ Threads 影片貼文＋留言連結
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 發布包代號（promo/<slug>.json）
        required: true
      dry:
        description: 只試跑不發布
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: 發布
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node src/tools/promo-post.js "promo/${{ inputs.slug }}.json" ${{ inputs.dry && '--dry' || '' }}
      - name: 記錄
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "shopee-robot"
          git config user.email "shopee-robot@users.noreply.github.com"
          git add dashboard/data
          git diff --cached --quiet && exit 0
          git commit -m "promo: ${{ inputs.slug }}"
          git pull --rebase -q && git push
