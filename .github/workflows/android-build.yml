name: Build Android APK

# Prerequisite (run once locally and commit the result):
#   cd mobile && npm install && npx cap add android && npx cap sync android
# This workflow assumes mobile/android already exists in the repo.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "mobile/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        working-directory: mobile
        run: npm install

      - name: Sync web assets into native project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shangri-la-frontier-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
