<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c2313">
<meta name="description" content="香格里拉：虛實邊界 — 探索、採集、建造，在虛實交界的島嶼上生存下去。">
<link rel="icon" href="./assets/logo/icons/logo-64.png">
<link rel="apple-touch-icon" href="./assets/logo/icons/logo-180.png">
<link rel="manifest" href="./manifest.json">
<!-- iOS "加入主畫面" 相關設定：讓網頁能像 App 一樣全螢幕啟動 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="香格里拉">
<meta name="mobile-web-app-capable" content="yes">
<title>香格里拉：虛實邊界 · Shangri-La: Realistic Frontier</title>
<style>
  :root{
    --amber:#F2C14E; --amber-dark:#c99a2e; --cream:#F4EFE1; --ink:#2c2313;
    --panel:#2c2313e6; --hp:#c1483f; --hunger:#d1583f; --stamina:#4f9e5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1330; font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed; inset:0;}
  #three-canvas{display:block; width:100%; height:100%; touch-action:none;}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:4;}

  #hud{position:fixed; top:0; left:0; right:0; padding:10px 12px; display:flex; flex-direction:column; gap:6px; pointer-events:none; z-index:5;}
  .toprow{display:flex; justify-content:space-between; align-items:flex-start;}
  .title{font-family:'Georgia', serif; font-weight:700; letter-spacing:2px; color:var(--amber); font-size:15px; text-shadow:0 2px 4px #000a;}
  .daynight{background:var(--panel); border:1px solid #ffffff22; border-radius:20px; padding:5px 12px; color:var(--cream); font-size:13px; display:flex; align-items:center; gap:5px;}
  .barsrow{display:flex; gap:8px; flex-wrap:wrap;}
  .stat{background:var(--panel); border:1px solid #ffffff22; border-radius:10px; padding:5px 9px; display:flex; align-items:center; gap:6px; min-width:74px;}
  .stat .icon{font-size:14px;}
  .stat .bar{width:44px; height:7px; background:#000000aa; border-radius:4px; overflow:hidden;}
  .stat .fill{height:100%; border-radius:4px; transition:width .25s;}
  .fill.hp{background:linear-gradient(90deg,#8a2620,var(--hp));}
  .fill.hunger{background:linear-gradient(90deg,var(--hunger),#e88a5a);}
  .fill.stamina{background:linear-gradient(90deg,#2f6e3a,var(--stamina));}
  .invrow{display:flex; gap:6px; flex-wrap:wrap;}
  .invchip{background:var(--panel); border:1px solid #ffffff22; border-radius:8px; padding:4px 8px; color:var(--cream); font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px;}

  #hint{position:fixed; top:106px; left:50%; transform:translateX(-50%); background:#000000aa; color:var(--cream); padding:6px 14px; border-radius:20px; font-size:12.5px; pointer-events:none; opacity:0; transition:opacity .3s; z-index:6; white-space:nowrap; max-width:88vw; text-align:center;}
  #hint.show{opacity:1;}

  #joyzone{position:fixed; left:0; bottom:0; width:45%; height:45%; z-index:5;}
  #joybase{position:fixed; width:100px; height:100px; border-radius:50%; background:#00000055; border:2px solid #ffffff44; display:none; z-index:6;}
  #joystick{position:fixed; width:44px; height:44px; border-radius:50%; background:var(--amber); border:2px solid var(--amber-dark); display:none; z-index:7; box-shadow:0 2px 6px #0006;}

  #actions{position:fixed; right:14px; bottom:22px; display:flex; flex-direction:column; align-items:flex-end; gap:10px; z-index:6;}
  .actbtn{background:var(--amber); color:var(--ink); border:none; border-radius:50%; width:58px; height:58px; font-size:21px; font-weight:700; box-shadow:0 3px 8px #0007; display:flex; align-items:center; justify-content:center; opacity:.5; transition:opacity .15s, transform .1s;}
  .actbtn.ready{opacity:1;}
  .actbtn:active{transform:scale(.9);}
  .actbtn.attack{background:#c1483f; color:#fff;}
  .smallbtn{width:44px; height:44px; font-size:17px; background:var(--panel); color:var(--cream); border:1px solid #ffffff33; opacity:1;}

  #menubar{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:8px; padding:10px; z-index:6; pointer-events:none; flex-wrap:wrap;}
  #menubar button{pointer-events:auto;}
  .menubtn{background:var(--panel); color:var(--cream); border:1px solid #ffffff33; border-radius:12px; padding:9px 14px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:5px;}
  .menubtn:active{filter:brightness(1.3);}

  .panel-overlay{position:fixed; inset:0; background:#000000a0; z-index:20; display:none; align-items:flex-end; justify-content:center;}
  .panel-overlay.open{display:flex;}
  .panel{background:linear-gradient(180deg,#3a2f1c,#231b10); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:16px 14px 22px; max-height:66vh; overflow-y:auto; border-top:1px solid #ffffff22;}
  .panel h2{color:var(--amber); font-family:Georgia,serif; margin:0 0 10px; font-size:17px; display:flex; justify-content:space-between; align-items:center;}
  .panel h2 span.close{font-size:20px; color:#cbbfa0; padding:0 6px;}
  .recipe{display:flex; align-items:center; gap:10px; background:#00000033; border:1px solid #ffffff1a; border-radius:12px; padding:10px; margin-bottom:8px;}
  .recipe .ricon{font-size:24px; width:34px; text-align:center;}
  .recipe .rinfo{flex:1;}
  .recipe .rname{color:var(--cream); font-weight:700; font-size:14px;}
  .recipe .rcost{color:#c9bfa2; font-size:11.5px; margin-top:2px;}
  .recipe button{background:var(--amber); color:var(--ink); border:none; border-radius:9px; padding:8px 12px; font-weight:700; font-size:12.5px; white-space:nowrap;}
  .recipe button:disabled{background:#5c5443; color:#8c8672;}

  #toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:#000000cc; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; z-index:50; opacity:0; transition:opacity .3s, top .3s; pointer-events:none; white-space:nowrap;}
  #toast.show{opacity:1; top:26px;}
  #placehint{position:fixed; bottom:126px; left:50%; transform:translateX(-50%); background:var(--amber); color:var(--ink); padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; z-index:8; display:none;}

  #startscreen{position:fixed; inset:0; z-index:100; background:radial-gradient(ellipse at center,#3a5a2b,#16210f); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--cream); padding:20px;}
  #startscreen h1{font-family:Georgia,serif; color:var(--amber); font-size:30px; letter-spacing:3px; margin-bottom:6px; text-shadow:0 3px 8px #000;}
  #startscreen p{font-size:13px; color:#d8cfb8; max-width:320px; line-height:1.6; margin-bottom:22px;}
  #startscreen .btnrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  #startscreen button{background:var(--amber); color:var(--ink); border:none; border-radius:14px; padding:13px 30px; font-size:15px; font-weight:700; box-shadow:0 4px 14px #0008;}
  #startscreen button.secondary{background:transparent; color:var(--cream); border:1.5px solid #ffffff55;}
  #loadingtxt{color:#d8cfb8; font-size:12px; margin-top:14px;}

  #deathoverlay{position:fixed; inset:0; z-index:90; background:#1a0705dd; display:none; align-items:center; justify-content:center; flex-direction:column; color:var(--cream); text-align:center;}
  #deathoverlay h2{color:#e0857a; font-family:Georgia,serif; font-size:26px; margin-bottom:8px;}
  #deathoverlay p{font-size:13px; color:#cbb; margin-bottom:20px;}
  #deathoverlay button{background:var(--amber); color:var(--ink); border:none; border-radius:14px; padding:12px 30px; font-weight:700; font-size:14px;}

  /* Landscape / responsive support */
  #rotateOverlay{
    position:fixed; inset:0; z-index:200; background:#0f0b06f2;
    display:none; align-items:center; justify-content:center; flex-direction:column; color:var(--cream); text-align:center; padding:30px;
  }
  #rotateOverlay .icon{font-size:52px; margin-bottom:14px; animation:rotatehint 1.6s ease-in-out infinite;}
  #rotateOverlay p{font-size:14px; color:#d8cfb8; max-width:280px; line-height:1.6;}
  @keyframes rotatehint{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(90deg);} }
  @media (orientation:portrait) and (max-width:900px){
    #rotateOverlay.active{display:flex;}
  }
  /* Desktop / large screen: keep HUD comfortably sized, cap width of panels */
  @media (min-width:900px){
    .panel{max-width:420px;}
    #hud{padding:16px 20px;}
    .title{font-size:17px;}
  }
  @media (min-width:1400px){
    #joyzone{width:32%; height:38%;}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="three-canvas"></canvas>
  <canvas id="fx"></canvas>

  <div id="rotateOverlay"><div class="icon">📱</div><p>請將裝置轉為橫向,以獲得最佳遊玩體驗</p></div>

  <div id="startscreen">
    <img src="./assets/logo/icons/logo-256.png" alt="logo" style="width:96px;height:96px;border-radius:50%;margin-bottom:14px;box-shadow:0 6px 20px #0008;">
    <h1>香格里拉<br><span style="font-size:14px; letter-spacing:4px; color:#d8cfb8;">虛 實 邊 界</span></h1>
    <p id="startdesc">一座立體的島嶼等你探索。白日採集建造,入夜怪物將從陰影中現身 — 小心保護你的家園。</p>
    <div class="btnrow">
      <button id="startbtn">開始新旅程</button>
      <button id="continuebtn" class="secondary" style="display:none;">繼續冒險</button>
    </div>
    <div id="loadingtxt">載入中...</div>
  </div>

  <div id="deathoverlay">
    <h2>☠ 你倒下了</h2>
    <p>失去了一半的物資,但家園還在。</p>
    <button id="respawnbtn">重新站起</button>
  </div>

  <div id="hud">
    <div class="toprow">
      <div class="title">香格里拉 · 虛實邊界</div>
      <div class="daynight"><span id="dnicon">☀️</span><span id="dntext">白晝</span></div>
    </div>
    <div class="barsrow">
      <div class="stat"><span class="icon">❤️</span><div class="bar"><div class="fill hp" id="hpfill" style="width:100%"></div></div></div>
      <div class="stat"><span class="icon">🍖</span><div class="bar"><div class="fill hunger" id="hungerfill" style="width:100%"></div></div></div>
      <div class="stat"><span class="icon">⚡</span><div class="bar"><div class="fill stamina" id="staminafill" style="width:100%"></div></div></div>
    </div>
    <div class="invrow">
      <div class="invchip">🌲 <span id="inv-wood">0</span></div>
      <div class="invchip">🪨 <span id="inv-stone">0</span></div>
      <div class="invchip">🍓 <span id="inv-food">0</span></div>
      <div class="invchip">🪵 <span id="inv-plank">0</span></div>
      <div class="invchip" id="weaponchip" style="display:none;">🪓 已裝備</div>
    </div>
  </div>

  <div id="hint"></div>
  <div id="toast"></div>
  <div id="placehint">👉 點擊地面放置</div>

  <div id="joyzone"></div>
  <div id="joybase"></div>
  <div id="joystick"></div>

  <div id="actions">
    <button class="actbtn smallbtn" id="btnCancelPlace" style="display:none;">✕</button>
    <button class="actbtn attack" id="btnAttack">⚔️</button>
    <button class="actbtn" id="btnGather">✋</button>
  </div>

  <div id="menubar">
    <button class="menubtn" id="btnCraftOpen">🛠️ 合成</button>
    <button class="menubtn" id="btnBuildOpen">🏠 建造</button>
    <button class="menubtn" id="btnSave">💾 存檔</button>
  </div>

  <div class="panel-overlay" id="craftOverlay">
    <div class="panel"><h2>合成台 <span class="close" id="craftClose">✕</span></h2><div id="craftList"></div></div>
  </div>
  <div class="panel-overlay" id="buildOverlay">
    <div class="panel"><h2>建造 <span class="close" id="buildClose">✕</span></h2><div id="buildList"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

// ============================================================
// CONSTANTS & WORLD
// ============================================================
const TILE = 4;
const WORLD_W = 40, WORLD_H = 40;
const HALF_W = WORLD_W*TILE/2, HALF_H = WORLD_H*TILE/2;
const SAVE_KEY = 'shangri_la_frontier_save_v1';

function tileToWorld(tx,ty){ return {x: tx*TILE - HALF_W + TILE/2, z: ty*TILE - HALF_H + TILE/2}; }
function worldToTile(x,z){ return {tx: Math.floor((x+HALF_W)/TILE), ty: Math.floor((z+HALF_H)/TILE)}; }

let rngSeed = 1337;
function rng(){ rngSeed = (rngSeed*1664525+1013904223)%4294967296; return rngSeed/4294967296; }

const RES_INFO = {
  tree:{icon:'🌲', name:'樹木', give:'wood', hp:3},
  rock:{icon:'🪨', name:'岩石', give:'stone', hp:4},
  bush:{icon:'🍓', name:'莓叢', give:'food', hp:2},
};

const world = []; // world[ty][tx] = {ground, obj:{type,hp,maxHp,alive,respawnAt,instanceIdx}, building:{kind}}
const resourceIndex = { tree:[], rock:[], bush:[] }; // list of {tx,ty}

function genWorld(){
  rngSeed = 1337;
  for(let y=0;y<WORLD_H;y++){
    const row=[];
    for(let x=0;x<WORLD_W;x++){
      let tile = {obj:null, building:null};
      const edge = (x<2||y<2||x>WORLD_W-3||y>WORLD_H-3);
      const r = rng();
      if(!edge){
        let type=null;
        if(r<0.08) type='tree';
        else if(r<0.13) type='rock';
        else if(r<0.17) type='bush';
        if(type){
          const info = RES_INFO[type];
          tile.obj = {type, hp:info.hp, maxHp:info.hp, alive:true, respawnAt:0, instanceIdx:resourceIndex[type].length};
          resourceIndex[type].push({tx:x,ty:y});
        }
      }
      row.push(tile);
    }
    world.push(row);
  }
  // clear spawn
  for(let y=18;y<=21;y++) for(let x=18;x<=21;x++){ world[y][x].obj=null; }
}
genWorld();

// ============================================================
// THREE SCENE
// ============================================================
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const fog = new THREE.Fog(0x0b1330, 40, 150);
scene.fog = fog;

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.5, 400);
camera.position.set(0, 16, 14);

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// lights
const ambient = new THREE.AmbientLight(0x8899bb, 0.4);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff2d0, 1);
sun.position.set(40,60,20);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x9fc4ff, 0x35442a, 0.5);
scene.add(hemi);

// sun/moon visual discs
function makeDisc(color){
  const geo = new THREE.CircleGeometry(4,20);
  const mat = new THREE.MeshBasicMaterial({color, fog:false});
  return new THREE.Mesh(geo,mat);
}
const sunDisc = makeDisc(0xffe9a3);
const moonDisc = makeDisc(0xdfe8ff);
scene.add(sunDisc, moonDisc);

// ground texture (canvas grid)
function makeGrassTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const g = c.getContext('2d');
  g.fillStyle = '#6f9a4c'; g.fillRect(0,0,64,64);
  for(let i=0;i<140;i++){
    g.fillStyle = `rgba(${20+Math.random()*30|0},${60+Math.random()*40|0},${20+Math.random()*20|0},${0.15+Math.random()*0.2})`;
    g.fillRect(Math.random()*64, Math.random()*64, 2,2);
  }
  g.strokeStyle='rgba(0,0,0,0.12)'; g.lineWidth=2; g.strokeRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(WORLD_W, WORLD_H);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}
const groundGeo = new THREE.PlaneGeometry(WORLD_W*TILE, WORLD_H*TILE);
const groundMat = new THREE.MeshStandardMaterial({map:makeGrassTexture(), roughness:1});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// water-less border wall (visual boundary)
const borderGeo = new THREE.BoxGeometry(WORLD_W*TILE+2, 3, 1);
const borderMat = new THREE.MeshStandardMaterial({color:0x4a3c28});
[[0,-HALF_H-0.5,0],[0,HALF_H+0.5,0]].forEach(([x,z])=>{
  const b = new THREE.Mesh(borderGeo, borderMat); b.position.set(x,1,z); scene.add(b);
});
const borderGeo2 = new THREE.BoxGeometry(1,3,WORLD_H*TILE+2);
[[-HALF_W-0.5,0,0],[HALF_W+0.5,0,0]].forEach(([x,,z])=>{
  const b = new THREE.Mesh(borderGeo2, borderMat); b.position.set(x,1,0); scene.add(b);
});

// ---------------- Resource instanced meshes ----------------
const resMeshes = {}; // type -> {trunk?, foliage?, main?, baseMatrices:[Matrix4]}

function buildTreeMeshes(){
  const count = resourceIndex.tree.length;
  const trunkGeo = new THREE.CylinderGeometry(0.18,0.24,1.2,6);
  const trunkMat = new THREE.MeshStandardMaterial({color:0x6b431f});
  const foliageGeo = new THREE.ConeGeometry(1.1,2.2,7);
  const foliageMat = new THREE.MeshStandardMaterial({color:0x3f6b2e});
  const trunk = new THREE.InstancedMesh(trunkGeo, trunkMat, Math.max(count,1));
  const foliage = new THREE.InstancedMesh(foliageGeo, foliageMat, Math.max(count,1));
  const base = [];
  const m = new THREE.Matrix4();
  resourceIndex.tree.forEach((pos,i)=>{
    const w = tileToWorld(pos.tx,pos.ty);
    const jx = (rng()-0.5)*0.6, jz=(rng()-0.5)*0.6, s=0.85+rng()*0.4;
    m.compose(new THREE.Vector3(w.x+jx, 0.6*s, w.z+jz), new THREE.Quaternion(), new THREE.Vector3(s,s,s));
    trunk.setMatrixAt(i, m); base.push(m.clone());
    m.compose(new THREE.Vector3(w.x+jx, 1.7*s, w.z+jz), new THREE.Quaternion(), new THREE.Vector3(s,s,s));
    foliage.setMatrixAt(i, m);
  });
  scene.add(trunk, foliage);
  resMeshes.tree = {trunk, foliage, baseTrunk:base, baseFoliage: base.map((mm,i)=>{
    const w = tileToWorld(resourceIndex.tree[i].tx, resourceIndex.tree[i].ty);
    return null; // not needed separately, recompute on respawn below
  })};
}

function buildRockMeshes(){
  const count = resourceIndex.rock.length;
  const geo = new THREE.IcosahedronGeometry(0.8,0);
  const mat = new THREE.MeshStandardMaterial({color:0x8c8c8c, flatShading:true});
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(count,1));
  const base=[];
  const m = new THREE.Matrix4();
  resourceIndex.rock.forEach((pos,i)=>{
    const w = tileToWorld(pos.tx,pos.ty);
    const s = 0.7+rng()*0.5;
    const rot = new THREE.Quaternion().setFromEuler(new THREE.Euler(rng()*3,rng()*3,rng()*3));
    m.compose(new THREE.Vector3(w.x+(rng()-0.5)*0.5, 0.5*s, w.z+(rng()-0.5)*0.5), rot, new THREE.Vector3(s,s,s));
    mesh.setMatrixAt(i,m); base.push(m.clone());
  });
  scene.add(mesh);
  resMeshes.rock = {main:mesh, base};
}

function buildBushMeshes(){
  const count = resourceIndex.bush.length;
  const geo = new THREE.SphereGeometry(0.65,8,7);
  const mat = new THREE.MeshStandardMaterial({color:0x5c8a3f});
  const berryGeo = new THREE.SphereGeometry(0.14,6,6);
  const berryMat = new THREE.MeshStandardMaterial({color:0xc1483f});
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(count,1));
  const berries = new THREE.InstancedMesh(berryGeo, berryMat, Math.max(count*3,1));
  const base=[]; const baseBerry=[];
  const m = new THREE.Matrix4();
  let bi=0;
  resourceIndex.bush.forEach((pos,i)=>{
    const w = tileToWorld(pos.tx,pos.ty);
    const s = 0.8+rng()*0.3;
    m.compose(new THREE.Vector3(w.x, 0.5*s, w.z), new THREE.Quaternion(), new THREE.Vector3(s,s,s));
    mesh.setMatrixAt(i,m); base.push(m.clone());
    for(let k=0;k<3;k++){
      const ang = rng()*Math.PI*2, rad=0.5*s;
      const bm = new THREE.Matrix4().compose(new THREE.Vector3(w.x+Math.cos(ang)*rad, 0.6*s, w.z+Math.sin(ang)*rad), new THREE.Quaternion(), new THREE.Vector3(1,1,1));
      berries.setMatrixAt(bi, bm); baseBerry.push(bm.clone()); bi++;
    }
  });
  scene.add(mesh, berries);
  resMeshes.bush = {main:mesh, berries, base, baseBerry};
}

buildTreeMeshes(); buildRockMeshes(); buildBushMeshes();

const ZERO_M = new THREE.Matrix4().compose(new THREE.Vector3(0,-50,0), new THREE.Quaternion(), new THREE.Vector3(0.001,0.001,0.001));

function setResourceVisible(type, idx, visible){
  const rm = resMeshes[type];
  if(type==='tree'){
    rm.trunk.setMatrixAt(idx, visible? rm.baseTrunk[idx] : ZERO_M);
    rm.foliage.setMatrixAt(idx, visible? rm.baseTrunk[idx].clone().setPosition(new THREE.Vector3(rm.baseTrunk[idx].elements[12], rm.baseTrunk[idx].elements[13]+1.1, rm.baseTrunk[idx].elements[14])) : ZERO_M);
    rm.trunk.instanceMatrix.needsUpdate = true; rm.foliage.instanceMatrix.needsUpdate = true;
  } else if(type==='rock'){
    rm.main.setMatrixAt(idx, visible? rm.base[idx] : ZERO_M);
    rm.main.instanceMatrix.needsUpdate = true;
  } else if(type==='bush'){
    rm.main.setMatrixAt(idx, visible? rm.base[idx] : ZERO_M);
    rm.main.instanceMatrix.needsUpdate = true;
    for(let k=0;k<3;k++){
      const bidx = idx*3+k;
      rm.berries.setMatrixAt(bidx, visible? rm.baseBerry[bidx] : ZERO_M);
    }
    rm.berries.instanceMatrix.needsUpdate = true;
  }
}

function makeCampfire(){
  const g = new THREE.Group();
  const logGeo = new THREE.CylinderGeometry(0.08,0.08,1,5);
  const logMat = new THREE.MeshStandardMaterial({color:0x5a3a1e});
  for(let i=0;i<4;i++){
    const log = new THREE.Mesh(logGeo, logMat);
    log.rotation.z = Math.PI/2; log.rotation.y = i*Math.PI/2;
    log.position.y = 0.15;
    g.add(log);
  }
  const flameGeo = new THREE.ConeGeometry(0.25,0.6,6);
  const flameMat = new THREE.MeshBasicMaterial({color:0xff9a3c});
  const flame = new THREE.Mesh(flameGeo, flameMat);
  flame.position.y = 0.55; flame.userData.flame = true;
  g.add(flame);
  const light = new THREE.PointLight(0xff9a4c, 1.4, 9, 2);
  light.position.y = 0.8;
  g.add(light);
  g.userData.flameMesh = flame;
  return g;
}
function makeWall(){
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(0.35, 1.6, 0.35);
  const mat = new THREE.MeshStandardMaterial({color:0x8B5A2B});
  const post = new THREE.Mesh(geo, mat); post.position.y=0.8;
  g.add(post);
  return g;
}
function makeFoundation(){
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(TILE*0.96, 0.25, TILE*0.96);
  const mat = new THREE.MeshStandardMaterial({color:0xb89968});
  const b = new THREE.Mesh(geo, mat); b.position.y=0.12;
  g.add(b);
  return g;
}
function makeBuildingMesh(kind){
  if(kind==='campfire') return makeCampfire();
  if(kind==='wall') return makeWall();
  if(kind==='foundation') return makeFoundation();
  return new THREE.Group();
}

function connectWalls(tx,ty){
  // add thin connector boxes between this wall and adjacent walls
  const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
  const key = `${tx},${ty}`;
  const w = tileToWorld(tx,ty);
  dirs.forEach(([dx,dy])=>{
    const ntx=tx+dx, nty=ty+dy;
    if(ntx<0||nty<0||ntx>=WORLD_W||nty>=WORLD_H) return;
    const nt = world[nty][ntx];
    if(nt.building && nt.building.kind==='wall'){
      const nw = tileToWorld(ntx,nty);
      const midX=(w.x+nw.x)/2, midZ=(w.z+nw.z)/2;
      const len = Math.hypot(nw.x-w.x, nw.z-w.z);
      const geo = new THREE.BoxGeometry(len, 1.1, 0.22);
      const mat = new THREE.MeshStandardMaterial({color:0x7a4a22});
      const beam = new THREE.Mesh(geo, mat);
      beam.position.set(midX, 0.75, midZ);
      beam.rotation.y = -Math.atan2(nw.z-w.z, nw.x-w.x);
      beam.userData.connector = `${key}|${ntx},${nty}`;
      buildingGroup.add(beam);
    }
  });
}

function placeBuilding(tx,ty,kind){
  const w = tileToWorld(tx,ty);
  const mesh = makeBuildingMesh(kind);
  mesh.position.set(w.x, 0, w.z);
  buildingGroup.add(mesh);
  buildingMeshes[`${tx},${ty}`] = mesh;
  world[ty][tx].building = {kind};
  if(kind==='wall') connectWalls(tx,ty);
}

  {id:'campfire', name:'營火', icon:'🔥', cost:{wood:3, stone:2}, desc:'照亮周圍,嚇阻怪物靠近'},
  {id:'wall', name:'木牆', icon:'🧱', cost:{plank:2}, desc:'相鄰放置會自動連接成圍欄'},

function renderCraftList(){
  const list = document.getElementById('craftList'); list.innerHTML='';
  RECIPES.forEach(r=>{
    const afford = canAfford(r.cost);
    const costStr = Object.keys(r.cost).map(k=>`${iconFor(k)}${r.cost[k]}`).join(' ');
    const div = document.createElement('div'); div.className='recipe';
    let already = r.type==='equip' && state.weapon;
    div.innerHTML = `<div class="ricon">${r.icon}</div>
      <div class="rinfo"><div class="rname">${r.name}</div><div class="rcost">需要 ${costStr}</div></div>
      <button ${(afford&&!already)?'':'disabled'}>${already?'已擁有':'合成'}</button>`;
    div.querySelector('button').addEventListener('click', ()=>{
      if(!canAfford(r.cost) || already) return;
      pay(r.cost);
      if(r.type==='item') Object.keys(r.give).forEach(k=> state[k]=(state[k]||0)+r.give[k]);
      else if(r.type==='consume') state.hunger = Math.min(100, state.hunger + r.heal.hunger);
      else if(r.type==='equip') state.weapon = true;
      updateInv(); renderCraftList();
      showToast(`合成完成:${r.name}`);
    });
    list.appendChild(div);
  });
}
function renderBuildList(){
  const list = document.getElementById('buildList'); list.innerHTML='';
  BUILD_RECIPES.forEach(r=>{
    const afford = canAfford(r.cost);
    const costStr = Object.keys(r.cost).map(k=>`${iconFor(k)}${r.cost[k]}`).join(' ');
    const div = document.createElement('div'); div.className='recipe';
    div.innerHTML = `<div class="ricon">${r.icon}</div>
      <div class="rinfo"><div class="rname">${r.name}</div><div class="rcost">${r.desc} · 需要 ${costStr}</div></div>

const joyzone = document.getElementById('joyzone');
const joybase = document.getElementById('joybase');
const joystick = document.getElementById('joystick');
let joyActive=false, joyStart={x:0,y:0}, joyVec={x:0,y:0};
function joyDown(cx,cy){
  joyActive=true; joyStart={x:cx,y:cy};
  joybase.style.left=(cx-50)+'px'; joybase.style.top=(cy-50)+'px'; joybase.style.display='block';
  joystick.style.left=(cx-22)+'px'; joystick.style.top=(cy-22)+'px'; joystick.style.display='block';
}
function joyMove(cx,cy){
  if(!joyActive) return;
  let dx=cx-joyStart.x, dy=cy-joyStart.y;
  const dist = Math.min(46, Math.hypot(dx,dy));
  const ang = Math.atan2(dy,dx);
  const sx=Math.cos(ang)*dist, sy=Math.sin(ang)*dist;
  joystick.style.left=(joyStart.x+sx-22)+'px'; joystick.style.top=(joyStart.y+sy-22)+'px';
  joyVec = dist>10? {x:Math.cos(ang), y:Math.sin(ang)} : {x:0,y:0};
}
function joyUp(){ joyActive=false; joyVec={x:0,y:0}; joybase.style.display='none'; joystick.style.display='none'; }
joyzone.addEventListener('touchstart', e=>{const t=e.touches[0]; joyDown(t.clientX,t.clientY);}, {passive:true});
joyzone.addEventListener('touchmove', e=>{const t=e.touches[0]; joyMove(t.clientX,t.clientY);}, {passive:true});
joyzone.addEventListener('touchend', joyUp);
joyzone.addEventListener('mousedown', e=>{ joyDown(e.clientX,e.clientY);
  function mm(ev){joyMove(ev.clientX,ev.clientY);}
  function mu(){joyUp(); window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu);}
  window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
});

// ---------------- gather / attack targeting ----------------
function nearestResourceTile(){
  const {tx:ptx, ty:pty} = worldToTile(player.x, player.z);
  let best=null, bestD=999;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x=ptx+dx, y=pty+dy;
    if(x<0||y<0||x>=WORLD_W||y>=WORLD_H) continue;
    const t = world[y][x];
    if(t.obj && t.obj.alive){
      const w = tileToWorld(x,y);
      const d = Math.hypot(w.x-player.x, w.z-player.z);
      if(d<3.6 && d<bestD){bestD=d; best={x,y,tile:t};}
    }
  }
  return best;
}
function nearestMonster(){
  let best=null, bestD=999;
  monsters.forEach(m=>{
    const d = Math.hypot(m.x-player.x, m.z-player.z);
    if(d<3.2 && d<bestD){bestD=d; best=m;}
  });
  return best;
}

const pops = []; // {x,y,z,text,born,life}
function spawnPop(x,y,z,text){ pops.push({x,y,z,text,born:performance.now(),life:750}); }

function doGather(){
  const target = nearestResourceTile();
  if(!target) return;
  const obj = target.tile.obj;
  const dmg = state.weapon? 2:1;
  obj.hp -= dmg;
  const w = tileToWorld(target.x, target.y);
  spawnPop(w.x, 1.6, w.z, RES_INFO[obj.type].icon);
  if(obj.hp<=0){
    const info = RES_INFO[obj.type];
    const gained = (state.weapon?1:0) + 1 + Math.floor(rng()*2);
    state[info.give] += gained;
    showToast(`+${gained} ${info.icon}`);
    obj.alive=false;
    obj.respawnAt = performance.now() + 20000 + rng()*10000;
    setResourceVisible(obj.type, obj.instanceIdx, false);
    updateInv();
  }
  state.stamina = Math.max(0, state.stamina-2);
}
function doAttack(){
  const m = nearestMonster();
  if(!m) return;
  const dmg = state.weapon? 28:13;
  m.hp -= dmg;
  const dir = new THREE.Vector3(m.x-player.x,0,m.z-player.z).normalize();
  m.x += dir.x*0.3; m.z += dir.z*0.3;
  spawnPop(m.x, 1.2, m.z, '💥');
  if(m.hp<=0){
    const dropFood = rng()<0.5;
    if(dropFood){ state.food+=1+Math.floor(rng()*2); } else { state.stone+=1+Math.floor(rng()*2); }
    showToast(dropFood? '擊敗史萊姆 +🍓' : '擊敗史萊姆 +🪨');
    updateInv();
    removeMonster(m);
  }
  state.stamina = Math.max(0, state.stamina-4);
}
document.getElementById('btnGather').addEventListener('click', ()=>{ if(!state.placing && !state.dead) doGather(); });
document.getElementById('btnAttack').addEventListener('click', ()=>{ if(!state.placing && !state.dead) doAttack(); });

// DAY / NIGHT

const DAY_COLOR = new THREE.Color(0x8fd0f5);
const NIGHT_COLOR = new THREE.Color(0x0b1330);
const DUSK_COLOR = new THREE.Color(0xe8916a);

function updateDayNight(dt){
  state.dayTime = (state.dayTime + dt/DAY_CYCLE) % 1;
  const ang = state.dayTime*Math.PI*2;
  const height = Math.sin(ang);
  sun.position.set(Math.cos(ang)*60, Math.max(height,0.05)*60+8, -30);
  sunDisc.position.copy(sun.position).multiplyScalar(1.4);
  moonDisc.position.set(-sun.position.x, Math.max(-height,0.05)*60+8, 30);
  sunDisc.visible = height>-0.05;
  moonDisc.visible = height<0.15;

  const dayFactor = Math.max(0, Math.min(1, height*1.3+0.15));
  let skyColor;
  if(height>0.05){ skyColor = NIGHT_COLOR.clone().lerp(DAY_COLOR, dayFactor); }
  else { skyColor = NIGHT_COLOR.clone().lerp(DUSK_COLOR, Math.max(0,(height+0.15)/0.2)); }
  scene.background = skyColor;
  fog.color = skyColor;
  sun.intensity = 0.15+0.9*Math.max(0,height);
  ambient.intensity = 0.2+0.35*dayFactor;
  hemi.intensity = 0.2+0.4*dayFactor;

  const isNight = height < 0.08;
  document.getElementById('dnicon').textContent = isNight? '🌙':'☀️';
  document.getElementById('dntext').textContent = isNight? '深夜':'白晝';
  return isNight;
}

function collectSave(){
  const deadResources = [];
  ['tree','rock','bush'].forEach(type=>{
    resourceIndex[type].forEach((pos,i)=>{
      const t = world[pos.ty][pos.tx];
      if(t.obj && !t.obj.alive) deadResources.push({type, i, respawnIn: Math.max(0, t.obj.respawnAt-performance.now())});
    });
  });
  const buildings = [];
  for(let y=0;y<WORLD_H;y++)for(let x=0;x<WORLD_W;x++){
    if(world[y][x].building) buildings.push({x,y,kind:world[y][x].building.kind});
  }
  return {
    player:{x:player.x, z:player.z, yaw:player.yaw, hp:player.hp},
    state:{hunger:state.hunger, stamina:state.stamina, wood:state.wood, stone:state.stone, food:state.food, plank:state.plank, weapon:state.weapon, dayTime:state.dayTime},
    deadResources, buildings, savedAt:Date.now()
  };
}
function saveGame(silent){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(collectSave()));
    if(!silent) showToast('已存檔 💾');
  }catch(e){ showToast('存檔失敗'); }
}
function loadGame(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  try{
    const data = JSON.parse(raw);
    player.x=data.player.x; player.z=data.player.z; player.yaw=data.player.yaw||0; player.hp=data.player.hp!=null?data.player.hp:100;
    Object.assign(state, data.state);
    (data.deadResources||[]).forEach(dr=>{
      const pos = resourceIndex[dr.type][dr.i];
      if(!pos) return;
      const t = world[pos.ty][pos.tx];
      if(t.obj){ t.obj.alive=false; t.obj.respawnAt = performance.now()+ (dr.respawnIn||10000); setResourceVisible(dr.type, dr.i, false); }
    });
    (data.buildings||[]).forEach(b=>{ if(!world[b.y][b.x].building) placeBuilding(b.x,b.y,b.kind); });
    updateInv();
    return true;
  }catch(e){ return false; }
}
document.getElementById('btnSave').addEventListener('click', ()=>saveGame(false));

  const w = tileToWorld(19,19);
  player.x=w.x; player.z=w.z; player.hp=100; state.hunger=60; state.stamina=100;
  document.getElementById('deathoverlay').style.display='none';
  state.dead=false;
});

// ============================================================
// FX overlay (pops + gather/attack targeting rings)
// ============================================================
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
function resizeFx(){ fxCanvas.width=innerWidth*(window.devicePixelRatio||1); fxCanvas.height=innerHeight*(window.devicePixelRatio||1); fxCanvas.style.width=innerWidth+'px'; fxCanvas.style.height=innerHeight+'px'; }
resizeFx(); window.addEventListener('resize', resizeFx);

// ---------------- Orientation / responsive guard ----------------
const rotateOverlay = document.getElementById('rotateOverlay');
function checkOrientation(){
  const isPortraitSmall = window.matchMedia('(orientation: portrait) and (max-width: 900px)').matches;
  rotateOverlay.classList.toggle('active', isPortraitSmall);
}
checkOrientation();
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
const projVec = new THREE.Vector3();
function worldToScreen(x,y,z){
  projVec.set(x,y,z).project(camera);
  const dpr = window.devicePixelRatio||1;
  return { x:(projVec.x*0.5+0.5)*innerWidth*dpr, y:(1-(projVec.y*0.5+0.5))*innerHeight*dpr, behind: projVec.z>1 };
}
function drawFx(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  const now = performance.now();
  for(let i=pops.length-1;i>=0;i--){
    const p = pops[i]; const age=now-p.born;
    if(age>p.life){ pops.splice(i,1); continue; }
    const s = worldToScreen(p.x, p.y+age/p.life*1.2, p.z);
    if(s.behind) continue;
    fxCtx.globalAlpha = 1-age/p.life;
    fxCtx.font = (20*(window.devicePixelRatio||1))+'px serif';
    fxCtx.textAlign='center';
    fxCtx.fillText(p.text, s.x, s.y);
  }
  fxCtx.globalAlpha=1;
  // monster hp bars
  monsters.forEach(m=>{
    if(m.hp>=m.maxHp) return;
    const s = worldToScreen(m.x, 1.25, m.z);
    if(s.behind) return;
    const dpr = window.devicePixelRatio||1;
    const w = 34*dpr;
    fxCtx.fillStyle='#000000aa'; fxCtx.fillRect(s.x-w/2, s.y-6*dpr, w, 4*dpr);
    fxCtx.fillStyle='#c1483f'; fxCtx.fillRect(s.x-w/2, s.y-6*dpr, w*(m.hp/m.maxHp), 4*dpr);
  });
}

// ============================================================
// MAIN LOOP
// ============================================================
let last = performance.now();
let autosaveTimer = 0;
let monsterSpawnTimer = 0;

function updateResourceRespawn(){
  const now = performance.now();
  ['tree','rock','bush'].forEach(type=>{
    resourceIndex[type].forEach((pos,i)=>{
      const t = world[pos.ty][pos.tx];
      if(t.obj && !t.obj.alive && now>t.obj.respawnAt){ t.obj.alive=true; t.obj.hp=t.obj.maxHp; setResourceVisible(type,i,true); }
    });
  });
}

function updatePlayerMovement(dt){
  let vx=0, vz=0;
  if(joyVec.x||joyVec.y){ vx=joyVec.x; vz=joyVec.y; }
  if(keys['w']||keys['arrowup']) vz=-1;
  if(keys['s']||keys['arrowdown']) vz=1;
  if(keys['a']||keys['arrowleft']) vx=-1;
  if(keys['d']||keys['arrowright']) vx=1;
  const mag = Math.hypot(vx,vz);
  player.moving = mag>0.05;
  if(player.moving){
    vx/=mag; vz/=mag;
    const nx = player.x+vx*player.speed*dt, nz = player.z+vz*player.speed*dt;
    if(canWalk(nx, player.z)) player.x=nx;
    if(canWalk(player.x, nz)) player.z=nz;
    const targetYaw = Math.atan2(vx,vz);
    let diff = targetYaw - player.yaw;
    while(diff>Math.PI) diff-=Math.PI*2; while(diff<-Math.PI) diff+=Math.PI*2;
    player.yaw += diff*Math.min(1,dt*10);
  }
  playerGroup.position.set(player.x,0,player.z);
  playerGroup.rotation.y = player.yaw;

  const camTargetX = player.x, camTargetZ = player.z+11, camTargetY=15;
  camera.position.x += (camTargetX-camera.position.x)*Math.min(1,dt*4);
  camera.position.z += (camTargetZ-camera.position.z)*Math.min(1,dt*4);
  camera.position.y += (camTargetY-camera.position.y)*Math.min(1,dt*4);
  camera.lookAt(player.x, 1, player.z);
}
function canWalk(x,z){
  if(Math.abs(x)>HALF_W-1 || Math.abs(z)>HALF_H-1) return false;
  const {tx,ty} = worldToTile(x,z);
  if(tx<0||ty<0||tx>=WORLD_W||ty>=WORLD_H) return false;
  const t = world[ty][tx];
  if(t.obj && t.obj.alive) return false;
  if(t.building && t.building.kind!=='foundation') return false;
  return true;
}

function updateMonsters(dt, isNight){
  monsterSpawnTimer -= dt;
  if(isNight && monsterSpawnTimer<=0){ spawnMonster(); monsterSpawnTimer = 3.5+rng()*3; }
  if(!isNight){
    // day: monsters flee/despawn gradually
    monsters.forEach(m=>{ m.fleeing=true; });
  }
  for(let i=monsters.length-1;i>=0;i--){
    const m = monsters[i];
    if(m.fleeing){
      m.mesh.material.opacity -= dt*0.6;
      m.mesh.scale.multiplyScalar(1-dt*0.6);
      if(m.mesh.material.opacity<=0.05){ removeMonster(m); continue; }
    } else {
      const dPlayer = Math.hypot(player.x-m.x, player.z-m.z);
      if(dPlayer < 9){ m.state='chase'; } else if(m.state==='chase' && dPlayer>13){ m.state='wander'; }
      let tx,tz;
      if(m.state==='chase'){ tx=player.x; tz=player.z; }
      else {
        if(!m.wanderT || performance.now()>m.wanderT){
          m.target = {x:m.x+(rng()-0.5)*8, z:m.z+(rng()-0.5)*8};
          m.wanderT = performance.now()+2000+rng()*2000;
        }
        tx=m.target.x; tz=m.target.z;
      }
      const dx=tx-m.x, dz=tz-m.z, d=Math.hypot(dx,dz);
      const spd = m.state==='chase'? 3.4:1.4;
      if(d>0.3){ m.x += dx/d*spd*dt; m.z += dz/d*spd*dt; }
      m.mesh.position.set(m.x, 0.5+Math.sin(performance.now()/220+i)*0.08, m.z);
      // contact damage
      const dp = Math.hypot(player.x-m.x, player.z-m.z);
      m.atkCd -= dt;
      if(dp<1.3 && m.atkCd<=0 && !state.dead){
        player.hp = Math.max(0, player.hp-8);
        m.atkCd = 1.1;
        spawnPop(player.x, 1.6, player.z, '💢');
        if(player.hp<=0) onDeath();
      }
    }
  }
}

function updateVitals(dt){
  if(state.dead) return;
  state.hunger = Math.max(0, state.hunger - dt*0.35);
  if(state.hunger<=0){ player.hp = Math.max(0, player.hp - dt*1.6); if(player.hp<=0) onDeath(); }
  if(!player.moving && state.stamina<100) state.stamina = Math.min(100, state.stamina+dt*4);
  document.getElementById('hpfill').style.width = player.hp+'%';
  document.getElementById('hungerfill').style.width = state.hunger+'%';
  document.getElementById('staminafill').style.width = state.stamina+'%';
}

function updateActionButtons(){
  const nearRes = !state.dead && !state.placing && nearestResourceTile();
  const gbtn = document.getElementById('btnGather');
  gbtn.classList.toggle('ready', !!nearRes);
  gbtn.textContent = nearRes? RES_INFO[nearRes.tile.obj.type].icon : '✋';
  const nearMon = !state.dead && !state.placing && nearestMonster();
  document.getElementById('btnAttack').classList.toggle('ready', !!nearMon);
}

function animate(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  requestAnimationFrame(animate);
  if(!state.started) { renderer.render(scene, camera); return; }

  const isNight = updateDayNight(dt);
  if(!state.dead){
    updatePlayerMovement(dt);
  }
  updateMonsters(dt, isNight);
  updateVitals(dt);
  updateResourceRespawn();
  updateActionButtons();

  // campfire flame flicker
  buildingGroup.children.forEach(obj=>{
    if(obj.userData && obj.userData.flameMesh){
      obj.userData.flameMesh.scale.y = 0.85+Math.sin(now/90)*0.15;
    }
  });

  autosaveTimer += dt;
  if(autosaveTimer>20){ autosaveTimer=0; saveGame(true); }

  renderer.render(scene, camera);
  drawFx();
}
requestAnimationFrame(animate);

window.addEventListener('visibilitychange', ()=>{ if(document.hidden && state.started) saveGame(true); });

})();
</script>

  // 讓 iOS / Android 都能「加入主畫面」離線啟動
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
</script>
